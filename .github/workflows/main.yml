name: Build Windows x64

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests + build (windows-latest, x64)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check repository layout
        shell: python
        run: |
          import pathlib, sys
          required = [
              "vmc.spec", "requirements.txt", "requirements-dev.txt", "pyproject.toml",
              "src/vmc/__init__.py", "src/vmc/cli.py", "src/vmc/export.py", "src/vmc/gui/app.py",
              "packaging/gui_entry.py", "packaging/cli_entry.py", "tests/conftest.py",
              "src/vmc/ai/liveportrait.py", "src/vmc/ai/mask_template.png",
          ]
          missing = [p for p in required if not pathlib.Path(p).is_file()]
          if missing:
              print("Fichiers manquants dans le depot :")
              for p in missing:
                  print("  -", p)
              print("Le depot doit contenir TOUT le contenu du zip a sa racine (src, tests, packaging, assets, ...).")
              sys.exit(1)
          print("Repository layout OK")

      - name: Fetch FFmpeg (bundled in the app)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $dest = Join-Path $PWD "vendor/ffmpeg"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $urls = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $ok = $false
          foreach ($u in $urls) {
            for ($i = 1; $i -le 3 -and -not $ok; $i++) {
              try {
                Write-Host "Downloading $u (attempt $i)"
                Invoke-WebRequest -Uri $u -OutFile $zip -UseBasicParsing
                $ok = $true
              } catch {
                Write-Warning $_.Exception.Message
                Start-Sleep -Seconds (3 * $i)
              }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "Could not download FFmpeg from any source." }
          $x = Join-Path $env:RUNNER_TEMP "ffmpeg-x"
          Expand-Archive -Path $zip -DestinationPath $x -Force
          $ff = Get-ChildItem $x -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ff) { throw "ffmpeg.exe not found in the archive." }
          $probe = Join-Path $ff.DirectoryName "ffprobe.exe"
          if (-not (Test-Path $probe)) { throw "ffprobe.exe not found next to ffmpeg.exe." }
          Copy-Item $ff.FullName $dest -Force
          Copy-Item $probe $dest -Force
          $lic = Get-ChildItem $x -Recurse -Filter "LICENSE*" | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName (Join-Path $dest "LICENSE.txt") -Force }
          & (Join-Path $dest "ffmpeg.exe") -hide_banner -version | Select-Object -First 1

      - name: Run tests
        run: python -m pytest -q

      - name: Build executables (PyInstaller)
        run: pyinstaller --noconfirm --clean vmc.spec

      - name: Verify the executables are x64
        shell: python
        run: |
          import pathlib, struct
          for name in ("VideoMotionControl.exe", "vmc.exe"):
              data = pathlib.Path("dist", "VideoMotionControl", name).read_bytes()
              pe = struct.unpack_from("<I", data, 0x3C)[0]
              machine = struct.unpack_from("<H", data, pe + 4)[0]
              assert machine == 0x8664, f"{name}: unexpected machine type {machine:#x}"
              print(f"{name}: x64 OK")

      - name: Smoke test the CLI (bundled FFmpeg, real render)
        shell: pwsh
        run: |
          function Invoke-Checked {
            param([string]$Exe, [string[]]$Arguments)
            & $Exe @Arguments
            if ($LASTEXITCODE -ne 0) { throw "Command failed ($LASTEXITCODE): $Exe $Arguments" }
          }
          $dist = (Resolve-Path "dist/VideoMotionControl").Path
          $ffmpeg = (Get-ChildItem $dist -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          $ffprobe = (Get-ChildItem $dist -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName
          $work = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Invoke-Checked "$dist/vmc.exe" @("--version")
          Invoke-Checked "$dist/vmc.exe" @("presets")
          $clip = Join-Path $work "clip.mp4"
          Invoke-Checked $ffmpeg @("-hide_banner","-loglevel","error","-y","-f","lavfi","-i","testsrc2=size=640x360:rate=30","-f","lavfi","-i","sine=frequency=440","-t","2","-pix_fmt","yuv420p","-c:v","libx264","-c:a","aac",$clip)
          $proj = Join-Path $work "p.json"
          $out = Join-Path $work "out.mp4"
          Invoke-Checked "$dist/vmc.exe" @("init",$clip,"-o",$proj,"--move","push","--render-to",$out)
          Invoke-Checked "$dist/vmc.exe" @("render",$proj,"--quality","draft","-q")
          $frames = (& $ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=p=0 $out).Trim()
          if ($frames -ne "60") { throw "Expected 60 frames, got '$frames'" }
          Write-Host "CLI render OK ($frames frames)"

      - name: Smoke test the AI (download models, real CPU inference)
        shell: pwsh
        env:
          VMC_MODELS: ${{ runner.temp }}\vmc-models
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $dist = (Resolve-Path "dist/VideoMotionControl").Path
          $ffmpeg = (Get-ChildItem $dist -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          $work = Join-Path $env:RUNNER_TEMP "ai"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $raw = "https://raw.githubusercontent.com/warmshao/FasterLivePortrait/master/assets/examples"
          Invoke-WebRequest "$raw/source/s5.jpg" -OutFile (Join-Path $work "ref.jpg")
          Invoke-WebRequest "$raw/driving/d0.mp4" -OutFile (Join-Path $work "drv_full.mp4")
          & $ffmpeg -hide_banner -loglevel error -y -i (Join-Path $work "drv_full.mp4") -t 1 -an -c:v libx264 (Join-Path $work "drv.mp4")
          & "$dist/vmc.exe" animate --download-models
          if ($LASTEXITCODE -ne 0) { throw "model download failed" }
          $out = Join-Path $work "out.mp4"
          & "$dist/vmc.exe" animate (Join-Path $work "ref.jpg") (Join-Path $work "drv.mp4") -o $out --max-side 512 --max-fps 8 -q
          if ($LASTEXITCODE -ne 0) { throw "AI animation failed ($LASTEXITCODE)" }
          if (-not (Test-Path $out) -or (Get-Item $out).Length -lt 1000) { throw "AI output missing" }
          Write-Host "AI animation OK"

      - name: Smoke test the GUI (offscreen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          VMC_SELFTEST_LOG: ${{ runner.temp }}\gui-selftest.txt
        run: |
          $exe = (Resolve-Path "dist/VideoMotionControl/VideoMotionControl.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path $env:VMC_SELFTEST_LOG) { Get-Content $env:VMC_SELFTEST_LOG }
          if ($p.ExitCode -ne 0) { throw "GUI self-test failed (exit code $($p.ExitCode))" }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/VideoMotionControl" -DestinationPath "VideoMotionControl-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: VideoMotionControl-windows-x64
          path: VideoMotionControl-windows-x64.zip
          compression-level: 0
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VideoMotionControl-windows-x64
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/VideoMotionControl-windows-x64.zip
          generate_release_notes: true
