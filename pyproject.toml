[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-motion-control"
dynamic = ["version"]
description = "Virtual camera moves (pan, zoom, rotation) with high-quality motion blur for video and stills."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]
dev = ["pytest>=8", "scipy>=1.11", "pyinstaller>=6.10"]

[project.scripts]
vmc = "vmc.cli:main"

[project.gui-scripts]
video-motion-control = "vmc.gui.app:run"

[tool.setuptools.dynamic]
version = { attr = "vmc.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
